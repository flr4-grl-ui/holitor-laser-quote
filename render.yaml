services:
  - type: web
    name: holitor-laser-quote
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SHOPIFY_SHOP_DOMAIN
        value: gmuucv-ex.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: ALLOWED_ORIGINS
        value: https://gmuucv-ex.myshopify.com
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
